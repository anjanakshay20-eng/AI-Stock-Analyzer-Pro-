[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#60a5fa"
backgroundColor = "#070d18"
secondaryBackgroundColor = "#0f172a"
textColor = "#8ba3c0"
font = "sans serif"
